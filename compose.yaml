name: ailoom

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_PATH: /app/data/ailoom.sqlite
      MEDIA_DIR: /app/data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in Coolify}
      BETTER_AUTH_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in Coolify}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in Coolify}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ailoom_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/ailoom.sqlite
      MEDIA_DIR: /app/data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in Coolify}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ailoom_data:/app/data

volumes:
  ailoom_data:
